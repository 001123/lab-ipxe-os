<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Matte Dark Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#192233" />
      <stop offset="60%" stop-color="#0d131f" />
      <stop offset="100%" stop-color="#05070e" />
    </radialGradient>

    <!-- Subtle Minimalist Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#334155" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.65" />
    </linearGradient>

    <!-- Vibrant Pure Orange Gradient for 'i' -->
    <linearGradient id="orangeIGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffad66" />
      <stop offset="30%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Soft Depth Glow & Shadow -->
    <filter id="dropShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#f97316" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Container Background -->
  <rect
    x="12"
    y="12"
    width="488"
    height="488"
    rx="116"
    fill="url(#bgGrad)"
    stroke="url(#borderGrad)"
    stroke-width="8"
  />

  <!-- === MINIMAL LETTER "i" (PERFECTLY CENTERED) === -->
  <g filter="url(#dropShadow)">
    <!-- Dot of the "i" -->
    <circle
      cx="256"
      cy="142"
      r="48"
      fill="url(#orangeIGrad)"
    />

    <!-- Stem of the "i" -->
    <rect
      x="208"
      y="224"
      width="96"
      height="194"
      rx="22"
      fill="url(#orangeIGrad)"
    />
  </g>
</svg>
