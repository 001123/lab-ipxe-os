<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Subtle Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#374151" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.4" />
    </linearGradient>

    <!-- Vibrant Orange Gradient for letter 'i' -->
    <linearGradient id="orangeIGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="45%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle Background -->
  <rect
    x="12"
    y="12"
    width="488"
    height="488"
    rx="116"
    fill="url(#bgGrad)"
    stroke="url(#borderGrad)"
    stroke-width="8"
  />

  <!-- Ambient Backlight -->
  <circle cx="256" cy="256" r="160" fill="#f97316" opacity="0.12" filter="url(#softGlow)" />

  <!-- === MINIMAL LETTER "i" === -->
  <!-- Dot of the "i" -->
  <circle
    cx="256"
    cy="144"
    r="44"
    fill="url(#orangeIGrad)"
    filter="url(#softGlow)"
  />

  <!-- Stem of the "i" -->
  <rect
    x="212"
    y="226"
    width="88"
    height="182"
    rx="44"
    fill="url(#orangeIGrad)"
    filter="url(#softGlow)"
  />
</svg>
