services:
  ipxe-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab-ipxe-os
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      # Change this to your Bun host LAN IP, e.g. http://192.168.1.50:3000
      - BASE_URL=http://192.168.1.50:3000
      - CONFIG_PATH=/app/config/hosts.yaml
      - IPXE_MENU_TIMEOUT=5
    volumes:
      - ./config:/app/config
      - ./assets:/app/assets
      - ./data:/app/data
