# ==============================================================================
# Bun Multi-OS iPXE & Cloud-Init Hosts Configuration
# ==============================================================================

# Default profile applied when a booting node's MAC address is not registered
default:
  os: ubuntu
  version: "24.04"
  profile: generic
  user: homelab
  # Optional: encrypted password hash (defaults to password 'ubuntu')
  # password_hash: "$6$rounds=4096$homelab$..."
  ssh_authorized_keys:
    - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPaWkIWwJqchLwmCMSN3hmUDVg08y3SU5L544sJSFpbW timi@Timi-Macbook-Pro-16-M4-Pro.local"
  storage:
    layout: direct
    target_disk: "/dev/sda"
  network:
    dhcp: true

# Declarative Node Inventory mapped by MAC address (lowercase, colon-separated)
hosts:
  # ----------------------------------------------------------------------------
  # VM Test
  # ----------------------------------------------------------------------------
  
  # VM Ubuntu K3s
  "bc:24:11:00:24:33":
    hostname: "k3s-single-node"
    note: "VM Ubuntu 24.04 chạy K3s Single-Node (NFS root boot)"
    os: ubuntu
    version: "24.04"
    profile: k3s-single-node
    custom:
      boot_method: nfs
      nfs_root: "192.168.250.4:/srv/nfs/ubuntu-${version}"
    network:
      dhcp: false
      ip: "192.168.250.33"
      netmask: "255.255.255.0"
      gateway: "192.168.250.1"
      nameservers: ["192.168.250.1", "1.1.1.1"]
    storage:
      target_disk: "/dev/sda"
    force_install: false

  # VM RKE2 Micro SUSE
  "bc:24:11:00:24:35":
    hostname: "rke2-micro-node"
    note: "VM openSUSE Leap Micro 6.2 chạy RKE2 Single-Node kết hợp ArgoCD GitOps"
    os: suse-micro
    version: "6.2"
    profile: rke2-single-node
    custom:
      rke2_version: ""
      rke2_token: ""
      rke2_cni: "canal"
      rke2_ingress: "traefik"
      # ArgoCD & GitOps Integration (tùy chọn):
      argocd: true
      # argocd_hostname: "argocd.192.168.250.35.nip.io"  # Tự động gán nếu bỏ trống
      # gitops_repo: "https://github.com/your-username/homelab-gitops.git"
      # gitops_branch: "main"
      # gitops_path: "apps"
    network:
      dhcp: false
      ip: "192.168.250.35"
      netmask: "255.255.255.0"
      gateway: "192.168.250.1"
      nameservers: ["192.168.250.1", "1.1.1.1"]
    storage:
      target_disk: "/dev/sda"
    force_install: false

  # ----------------------------------------------------------------------------
  # (Bare-Metal K3s Server)
  # ----------------------------------------------------------------------------

  # Bare-Metal K3s Server
  # "e8:9c:25:7b:af:d8":
  #   hostname: "k3s-single-node-i5"
  #   os: ubuntu
  #   version: "24.04"
  #   profile: k3s-single-node
  #   custom:
  #     boot_method: nfs
  #     nfs_root: "192.168.250.4:/srv/nfs/ubuntu-24.04"
  #     k3s_version: "v1.36.4+k3s1"
  #   network:
  #     dhcp: false
  #     ip: "192.168.250.34"
  #     netmask: "255.255.255.0"
  #     gateway: "192.168.250.1"
  #     nameservers: ["192.168.250.1", "1.1.1.1"]
  #   storage:
  #     target_disk: "/dev/sda"
  #   force_install: false

  # Bare-Metal RKE2 Micro SUSE
  "e8:9c:25:7b:af:d8":
    hostname: "rke2-single-node-i5"
    note: "Bare-metal Intel i5 Server chạy RKE2 Single-Node trên openSUSE Leap Micro 6.2"
    os: suse-micro
    version: "6.2"
    profile: rke2-single-node
    custom:
      rke2_version: ""
      rke2_token: ""
      rke2_cni: "canal"
      rke2_ingress: "traefik"
      # ArgoCD & GitOps Integration (tùy chọn):
      # argocd: true
      # argocd_hostname: "argocd.192.168.250.2.nip.io"
      # gitops_repo: "https://github.com/your-username/homelab-gitops.git"
      # gitops_branch: "main"
      # gitops_path: "apps"
    network:
      dhcp: false
      ip: "192.168.250.2"
      netmask: "255.255.255.0"
      gateway: "192.168.250.1"
      nameservers: ["192.168.250.1", "1.1.1.1"]
    storage:
      target_disk: "/dev/sda"
    force_install: false
