# ==============================================================================
# Bun Multi-OS iPXE & Cloud-Init Hosts Configuration (EXAMPLE TEMPLATE)
# ==============================================================================
# Hướng dẫn:
# 1. Sao chép file này sang config/hosts.yaml:
#    cp config/hosts.example.yaml config/hosts.yaml
# 2. Thay thế SSH public key, MAC address và các thông số IP/mạng cho node của bạn.
# 3. Xem thêm các template chuyên sâu cho từng OS trong thư mục config/examples/
# ==============================================================================

# Default profile applied when a booting node's MAC address is not registered
default:
  os: ubuntu
  version: "24.04"
  profile: generic
  user: homelab
  # Optional: encrypted password hash (defaults to password 'ubuntu')
  # password_hash: "$6$rounds=4096$homelab$..."
  ssh_authorized_keys:
    - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEXAMPLEKEYPLACEHOLDER00000000000000000000000 user@homelab.local"
  storage:
    layout: direct
    target_disk: "/dev/sda"
  network:
    dhcp: true

# Declarative Node Inventory mapped by MAC address (lowercase, colon-separated)
hosts:
  # ----------------------------------------------------------------------------
  # Ubuntu Node (Ví dụ: K3s Single-Node NFS root boot)
  # ----------------------------------------------------------------------------
  "bc:24:11:00:24:33":
    hostname: "k3s-single-node"
    note: "VM Ubuntu 24.04 chạy K3s Single-Node (NFS root boot)"
    os: ubuntu
    version: "24.04"
    profile: k3s-single-node
    custom:
      boot_method: nfs
      nfs_root: "192.168.250.4:/srv/nfs/ubuntu-${version}"
    network:
      dhcp: false
      ip: "192.168.250.33"
      netmask: "255.255.255.0"
      gateway: "192.168.250.1"
      nameservers: ["192.168.250.1", "1.1.1.1"]
    storage:
      target_disk: "/dev/sda"
    force_install: false

  # ----------------------------------------------------------------------------
  # openSUSE Leap Micro Node (Ví dụ: RKE2 Single-Node + ArgoCD GitOps)
  # ----------------------------------------------------------------------------
  "bc:24:11:00:24:35":
    hostname: "rke2-micro-node"
    note: "VM openSUSE Leap Micro 6.2 chạy RKE2 Single-Node kết hợp ArgoCD GitOps"
    os: suse-micro
    version: "6.2"
    profile: rke2-single-node
    custom:
      rke2_version: ""
      rke2_token: ""
      rke2_cni: "canal"
      rke2_ingress: "traefik"
      # ArgoCD & GitOps Integration (tùy chọn):
      argocd: true
      # argocd_hostname: "argocd.192.168.250.35.nip.io"
      # gitops_repo: "https://github.com/your-username/homelab-gitops.git"
      # gitops_branch: "main"
      # gitops_path: "apps"
    network:
      dhcp: false
      ip: "192.168.250.35"
      netmask: "255.255.255.0"
      gateway: "192.168.250.1"
      nameservers: ["192.168.250.1", "1.1.1.1"]
    storage:
      target_disk: "/dev/sda"
    force_install: false

  # ----------------------------------------------------------------------------
  # Talos Linux Node (Ví dụ: Controlplane Kubernetes)
  # ----------------------------------------------------------------------------
  "bc:24:11:00:24:36":
    hostname: "talos-controlplane-01"
    note: "Talos Linux v1.14.0 Controlplane Node"
    os: talos
    version: "v1.14.0"
    role: "controlplane" # 'controlplane' hoặc 'worker'
    custom:
      clusterName: "talos-homelab"
      cni: "flannel"
    network:
      dhcp: false
      ip: "192.168.250.36"
      netmask: "255.255.255.0"
      gateway: "192.168.250.1"
      nameservers: ["192.168.250.1", "1.1.1.1"]
    storage:
      target_disk: "/dev/sda"
    force_install: false

